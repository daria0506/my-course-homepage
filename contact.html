<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Daria Cotoc | Contact</title>
</head>

<body>
  <a href="#main-content">Skip to main content</a>

  <header>
    <h1>Contact Daria</h1>
    <p>Send me a message regarding Web Design course.</p>
  </header>

  <nav aria-label="Main navigation">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main id="main-content">
    <section>
      <h2>Contact form</h2>

      <form method="post" action="#" aria-label="Contact form">
        <fieldset>
          <legend>Daria Cotoc</legend>

          <p>
            <label for="full-name">Full name (required)</label><br />
            <input type="text" id="full-name" name="name" required />
          </p>

          <p>
            <label for="email">Email (required)</label><br />
            <input type="email" id="email" name="email" required />
          </p>
        </fieldset>

        <fieldset>
          <legend>Your message</legend>

          <p>
            <label for="subject">Subject (required)</label><br />
            <input type="text" id="subject" name="subject" required aria-describedby="subject-hint" />
            <br />
            <small id="subject-hint">Example: “Lab 2 question”</small>
          </p>

          <p>
            <label for="message">Message (required)</label><br />
            <textarea id="message" name="message" rows="5" required></textarea>
          </p>
        </fieldset>

        <fieldset>
          <legend>How did you hear about this course?</legend>

          <p>
            <input type="radio" id="hear-friends" name="hear" value="friends" />
            <label for="hear-friends">Friends</label>
          </p>

          <p>
            <input type="radio" id="hear-web" name="hear" value="web" />
            <label for="hear-web">Web / Search</label>
          </p>

          <p>
            <input type="radio" id="hear-other" name="hear" value="other" />
            <label for="hear-other">Other</label>
          </p>
        </fieldset>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Daria Cotoc · Web Design · Semester II</p>
  </footer>
</body>
</html>
